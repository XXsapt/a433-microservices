name: Frontend CI

on:
  push:
    branches: [karsajobs-ui]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [karsajobs-ui]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /bin/hadolint

      - name: Lint Dockerfile
        run: hadolint Dockerfile

  build-app-karsajobs-ui:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: lint-dockerfile

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BERNAD }}
          password: ${{ secrets.PASSDOCKER }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.BERNAD }}/karsajobs-ui:latest
