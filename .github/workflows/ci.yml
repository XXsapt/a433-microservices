name: CI for karsajobs-ui

on:
  push:
    branches:
      - karsajobs-ui
  pull_request:
    branches:
      - karsajobs-ui

jobs:
  lint-frontend:
    name: Lint Vue.js Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint
        # Komentar: Menjalankan linting Vue.js menggunakan ESLint.

  build-frontend:
    name: Build Vue.js Project
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        # Komentar: Menjalankan proses build frontend.

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install hadolint
        run: |
          wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /bin/hadolint

      - name: Run hadolint
        run: hadolint Dockerfile
        # Komentar: Mengecek Dockerfile untuk memastikan best practice.

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-frontend, lint-dockerfile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.BERNAD }}
          password: ${{ secrets.PASSDOCKER }}

      - name: Run Build & Push Script
        run: |
          chmod +x build_push_image_karsajobs_ui.sh
          ./build_push_image_karsajobs_ui.sh
        # Komentar: Build dan push Docker image frontend.
